version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: tea_postgres
    restart: always
    environment:
      POSTGRES_USER: tea_user
      POSTGRES_PASSWORD: tea_password
      POSTGRES_DB: tea_bot_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: tea_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tea.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

  backend:
    build: ./backend
    container_name: tea_backend
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres

volumes:
  postgres_data: